# ============================================================
# Mosquitto MQTT Broker Configuration - CLEAN VERSION
# ============================================================

# Main listener (MQTT)
listener 1883
protocol mqtt

# WebSockets listener (Grafana/Browser)
# listener 9001 0.0.0.0
# protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Security and Authentication
# IMPORTANT: Do not leave trailing spaces at the end of paths
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd

# Limits (Using the log recommendation)
max_packet_size 65536
retain_available true
max_connections 50          # Prevents Denial of Service (DoS) attacks from saturating the broker
max_queued_messages 100       # Limits the in-memory message queue per client