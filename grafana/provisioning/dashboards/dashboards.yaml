apiVersion: 1

providers:
  - name: GreenhouseBrain
    orgId: 1
    folder: "GreenhouseBrain"
    folderUid: greenhouse_folder
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
